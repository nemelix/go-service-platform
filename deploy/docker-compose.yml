name: go-service-platform

services:
  app:
    image: ghcr.io/nemelix/go-service-platform:${APP_TAG:-latest}
    env_file: app.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      APP_ADDR: ${APP_ADDR:-:8080}

  db:
    image: postgres:18-alpine
    env_file: db.env
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.8.0
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    profiles: ["tools"]

volumes:
  pgdata:
  certbot-www:
  certbot-conf: